<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Energy minimization</title>
    <meta name="description" content="Interactive visualizations of energy-minimizing configurations of points on the sphere." />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="overview">
      <h1 class="sr-only">Energy minimization on the sphere</h1>
      <a class="tile" href="./8-S2/" aria-label="Eight points on the sphere">
        <canvas data-problem="8-S2"></canvas>
        <span class="tile-label"><i>N</i> = 8 on <i>S</i>²</span>
      </a>
      <a class="tile" href="./11-S2/" aria-label="Eleven points on the sphere">
        <canvas data-problem="11-S2"></canvas>
        <span class="tile-label"><i>N</i> = 11 on <i>S</i>²</span>
      </a>
      <a class="tile" href="./14-S2/" aria-label="Fourteen points on the sphere">
        <canvas data-problem="14-S2"></canvas>
        <span class="tile-label"><i>N</i> = 14 on <i>S</i>²</span>
      </a>
      <a class="tile" href="./9-S3/" aria-label="Nine points on the three-sphere">
        <canvas data-problem="9-S3"></canvas>
        <span class="tile-label"><i>N</i> = 9 on <i>S</i>³</span>
      </a>
    </main>

    <script type="module" src="./overview/main.js"></script>
  </body>
</html>
